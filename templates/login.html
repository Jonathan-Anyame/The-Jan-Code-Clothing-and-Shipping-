{% extends "base.html" %}

{% block title %}Login | The Jan Code{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to your Jan Code account</p>

        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="username">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p>Don't have an account? <a href="/register">Register here</a></p>
        <p class="auth-demo">Demo Admin: username <strong>admin</strong> · password <strong>admin</strong></p>
    </div>
</section>
{% endblock %}
